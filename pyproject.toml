[project]
name = "ubnt-edgemax-power-monitor"
version = "0.2.0"
description = "MQTT + Web UI front-end for controlling and monitoring PoE on a Ubiquiti EdgeSwitch over SSH."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "paramiko>=3.4",
    "paho-mqtt>=1.6,<3",
    "Flask>=3.0,<4",
]

[project.scripts]
poe-control = "poe_control_mqtt:main"
poe-status = "poe_status_to_mqtt:main"
poe-web-ui = "web_ui:main"
mqtt-test = "mqtt_test:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Distribute the three CLI modules + the shared config loader and web UI assets.
include = [
    "config.py",
    "poe_control_mqtt.py",
    "poe_status_to_mqtt.py",
    "mqtt_test.py",
    "web_ui.py",
    "templates/**",
    "static/**",
]

[tool.hatch.build.targets.wheel.sources]
"templates" = "templates"
"static" = "static"

[tool.uv]
# uv works fine without anything here, but pin a couple of conveniences.
package = true
